services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: experiment_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./src
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/experiment_platform
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-this-in-production
      JWT_EXPIRY: 24h
      BANDIT_SERVICE_URL: http://bandit:8000
      BANDIT_API_KEY: internal-service-key-change-me
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bandit:
    build: ./bandit-service
    ports:
      - "8000:8000"
    environment:
      BANDIT_API_KEY: internal-service-key-change-me
      NODE_SERVICE_URL: http://api:3000

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
